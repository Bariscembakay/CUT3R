# Scale-up 2, frame-0 control. scale_frame0's recipe with the data audit's changes:
# nuScenes from all six cameras (the back camera is the only driving view near
# KITTI's field of view: focal/width 0.50 vs 0.58), TartanGround and ScanNet++
# (iPhone video) added; the validation hold-outs in rel/splits are kept out of
# training and scored every epoch, so the run length is read off the validation
# curves. The CUT3R-rel arm, scale2_rel.yaml, changes only the criterion.
# Ray-map queries stay off.
defaults:
  - pilot_frame0
  - _self_

static_prob: 0.0
# 64-view clips, 8-frame truncated-backprop chunks, 4 trained chunks (32 frames)
# at a random start chunk: trained frames see 0 to 63 frames of history, the
# first predictions of a stream included, and a write to the state is credited
# up to 7 frames ahead (upstream: last 16 of the clip, 4-frame chunks).
num_views: 64
num_test_views: 64
tbptt_chunk: 8
tbptt_train_chunks: 4
tbptt_random_start: true
train_kw: video_only=True, no_raymap=True, static_prob=${static_prob}, aug_crop=16, resolution=${pilot_res},
  transform=SeqColorJitter, num_views=${num_views}, n_corres=${n_corres_train}
dataset1: VideoRGBD_Multi(split='train', ROOT='${data_root}/arkitscenes-cut3r-video-full', name='arkitscenes_video',
  max_interval=4, holdout='rel/splits/arkitscenes_val.txt', ${train_kw})
dataset2: TartanAirRaw_Multi(ROOT='${data_root}/tartanair-v1', holdout='rel/splits/tartanair_val_envs.txt', ${train_kw})
dataset3: TartanAirV2Raw_Multi(ROOT='${data_root}/tartanair-v2', holdout='rel/splits/tartanair_val_envs.txt', ${train_kw})
dataset4: ScanNetExtracted_Multi(split='train', ROOT='${data_root}/scannet-v2-extracted', max_interval=30,
  holdout='rel/splits/scannet_val.txt', ${train_kw})
dataset5: VideoRGBD_Multi(split='train', ROOT='${data_root}/nuscenes-cut3r-video-6cam', name='nuscenes_6cam',
  max_interval=12, holdout='rel/splits/nuscenes_val.txt', ${train_kw})
dataset6: TartanGroundRaw_Multi(ROOT='${data_root}/tartanground', holdout='rel/splits/tartanair_val_envs.txt', ${train_kw})
dataset7: VideoRGBD_Multi(split='train', ROOT='${data_root}/scannetpp-cut3r-video', name='scannetpp_video',
  max_interval=10, holdout='rel/splits/scannetpp_val.txt', ${train_kw})
train_dataset: 2000 @ ${dataset1} + 2000 @ ${dataset2} + 2000 @ ${dataset3} + 2000 @ ${dataset4} + 2000 @ ${dataset5}
  + 2000 @ ${dataset6} + 2000 @ ${dataset7}

# One validation set per dataset, the held-out scenes only, fixed clips.
val_clips: 64
val_kw: video_only=True, no_raymap=True, holdout_mode='only', num_views=${num_test_views}, seed=42,
  n_corres=${n_corres_test}
test_dataset: ${val_clips} @ VideoRGBD_Multi(split='train', ROOT='${data_root}/arkitscenes-cut3r-video-full',
  name='arkitscenes_val', max_interval=4, holdout='rel/splits/arkitscenes_val.txt', resolution=(512, 384), ${val_kw})
  + ${val_clips} @ TartanAirRaw_Multi(ROOT='${data_root}/tartanair-v1', holdout='rel/splits/tartanair_val_envs.txt',
  resolution=(512, 384), ${val_kw})
  + ${val_clips} @ TartanAirV2Raw_Multi(ROOT='${data_root}/tartanair-v2', holdout='rel/splits/tartanair_val_envs.txt',
  resolution=(512, 384), ${val_kw})
  + ${val_clips} @ ScanNetExtracted_Multi(split='train', ROOT='${data_root}/scannet-v2-extracted', max_interval=30,
  holdout='rel/splits/scannet_val.txt', resolution=(512, 384), ${val_kw})
  + ${val_clips} @ VideoRGBD_Multi(split='train', ROOT='${data_root}/nuscenes-cut3r-video-6cam', name='nuscenes_6cam_val',
  max_interval=12, holdout='rel/splits/nuscenes_val.txt', resolution=(512, 288), ${val_kw})
  + ${val_clips} @ TartanGroundRaw_Multi(ROOT='${data_root}/tartanground', holdout='rel/splits/tartanair_val_envs.txt',
  resolution=(512, 384), ${val_kw})
  + ${val_clips} @ VideoRGBD_Multi(split='train', ROOT='${data_root}/scannetpp-cut3r-video', name='scannetpp_val',
  max_interval=10, holdout='rel/splits/scannetpp_val.txt', resolution=(512, 384), ${val_kw})

eval_freq: 1
# Constant learning rate after warmup (warmup-stable-decay), so the run can be
# extended while the validation curves still improve; once stopped, cool down
# from the chosen epoch E by resuming with decay_start=E epochs=E+k (cosine to
# min_lr). checkpoint-best = lowest mean validation loss; every keep_freq-th
# epoch is kept for the rest.
lr_schedule: wsd
decay_start: null
epochs: 30
keep_freq: 2
exp_name: scale2_frame0
